
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miss Camila Studio | Elegant Party Design & Printables</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root {
        --aqua: #AEECEF;
        --peach: #FFD8B1;
        --lilac: #E0BBE4;
        --pink: #FFC4D6;
        --cream: #FFFDF9;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--cream);
        color: #333;
        scroll-behavior: smooth;
      }
      h1, h2, h3, .brand-font {
        font-family: 'Playfair Display', serif;
      }
      .bg-party-gradient {
        background: linear-gradient(135deg, rgba(174,236,239,0.1) 0%, rgba(255,216,177,0.1) 33%, rgba(224,187,228,0.1) 66%, rgba(255,196,214,0.1) 100%);
      }
      .confetti-dot {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        opacity: 0.3;
        pointer-events: none;
      }
      .wavy-divider {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        overflow: hidden;
        line-height: 0;
      }
      .wavy-divider svg {
        position: relative;
        display: block;
        width: calc(100% + 1.3px);
        height: 60px;
      }
    </style>

}
</script>
</head>

  </body>
